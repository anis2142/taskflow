<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | TaskFlow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body data-page="login" class="login-page">

  <div class="login-box">
    <h2>TaskFlow<span>.</span></h2>
    <p class="text-muted mb-4">Your study planner</p>

    <form id="loginForm">
      <label class="form-label">Username</label>
      <input
        id="username"
        type="text"
        class="form-control mb-3"
        placeholder="Enter username"
        autocomplete="username"
        required
      >

      <label class="form-label">Password</label>
      <input
        id="password"
        type="password"
        class="form-control mb-3"
        placeholder="Enter password"
        autocomplete="current-password"
        required
      >

      <p id="error" class="text-danger small"></p>

      <button type="submit" class="btn main-btn w-100">
        Login
      </button>
    </form>

    <div class="text-center mt-4">
      <small class="text-muted">Demo accounts</small>
      <p class="small mb-0">Username: anis / aina </p>
      <p class="small mb-0">Password: 1234</p>
    </div>
  </div>

<script src="js/data.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
