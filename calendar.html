
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calendar | TaskFlow</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body data-page="calendar">


<nav class="navbar navbar-expand-lg task-navbar">
  <div class="container">

    <a class="navbar-brand" href="dashboard.html">
      TaskFlow<span>.</span>
    </a>

    <button class="navbar-toggler" type="button"
      data-bs-toggle="collapse" data-bs-target="#menu">
      ☰
    </button>

    <div class="collapse navbar-collapse" id="menu">

      <div class="navbar-nav task-nav-links">
        <a class="nav-link" href="dashboard.html">Overview</a>
        <a class="nav-link" href="tasks.html">Assignments</a>
        <a class="nav-link active" href="calendar.html">Calendar</a>
        <a class="nav-link" href="planner.html">Smart Planner</a>
        <a class="nav-link" href="team.html">Students</a>
      </div>

      <button class="btn logout-btn" onclick="logout()">Logout</button>

    </div>
  </div>
</nav>


  <main class="container py-4">

    <div class="mb-4">
      <h2>Assignment Calendar</h2>
      <p class="text-secondary">Keep track of your upcoming deadlines.</p>
    </div>

    <div class="row g-4">

      <div class="col-lg-8">
        <div class="panel">

          <div class="d-flex justify-content-between align-items-center mb-4">
            <button class="btn btn-outline-secondary" id="prevMonth">&lt;</button>
            <h5 id="calendarTitle" class="mb-0"></h5>
            <button class="btn btn-outline-secondary" id="nextMonth">&gt;</button>
          </div>

          <div class="calendar-grid" id="calendarGrid"></div>

          <div class="mt-4 small text-secondary">
            <span class="calendar-dot"></span> Assignment deadline
          </div>

        </div>
      </div>

      <div class="col-lg-4">
        <div class="panel">

          <h5 id="selectedDate">Select a date</h5>
          <p class="text-secondary small">Assignments scheduled for this day</p>

          <div id="dateTasks">
            <p class="text-secondary">Select a date on the calendar.</p>
          </div>

        </div>
      </div>

    </div>

  </main>

  <footer>© 2026 TaskFlow. Student Productivity Planner.</footer>

<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/calendar.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
