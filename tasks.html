
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Assignments | TaskFlow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body data-page="tasks">

<nav class="navbar navbar-expand-lg task-navbar">
  <div class="container">
    <a class="navbar-brand" href="dashboard.html">Task<span>Flow</span></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarMenu">
      <div class="navbar-nav task-nav-links">
        <a class="nav-link" href="dashboard.html">Overview</a>
        <a class="nav-link active" href="tasks.html">Assignments</a>
        <a class="nav-link" href="calendar.html">Calendar</a>
        <a class="nav-link" href="planner.html">Smart Planner</a>
        <a class="nav-link" href="team.html">Students</a>
      </div>
      <button class="btn logout-btn" onclick="logout()">Logout</button>
    </div>
  </div>
</nav>

<main class="container py-4">
  <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
    <div>
      <h2>My Assignments</h2>
      <p class="text-muted mb-0">Manage and keep track of your assignments.</p>
    </div>
    <button class="btn main-btn" id="addTaskBtn">+ Add Assignment</button>
  </div>

  <div class="panel mb-4" id="taskFormPanel" hidden>
    <h5 id="formTitle">Add New Assignment</h5>

    <form id="taskForm">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Assignment Title</label>
          <input type="text" class="form-control" id="taskTitle" required>
        </div>

        <div class="col-md-6">
          <label class="form-label">Subject</label>
          <input type="text" class="form-control" id="taskSubject" required>
        </div>

        <div class="col-md-6">
          <label class="form-label">Due Date</label>
          <input type="date" class="form-control" id="taskDue" required>
        </div>

        <div class="col-md-6">
          <label class="form-label">Status</label>
          <select class="form-select" id="taskStatus">
            <option>Not started</option>
            <option>In progress</option>
            <option>Completed</option>
          </select>
        </div>
      </div>

      <div class="mt-3 d-flex gap-2">
        <button type="submit" class="btn main-btn" id="saveTaskBtn">Save Assignment</button>
        <button type="button" class="btn btn-outline-secondary" id="cancelTaskBtn">Cancel</button>
      </div>
    </form>
  </div>

  <div class="panel">
    <div class="d-flex flex-wrap gap-3 justify-content-between mb-3">
      <input type="search" class="form-control search-box" id="searchTask" placeholder="Search assignments...">

      <select class="form-select filter-box" id="filterStatus">
        <option value="All">All Status</option>
        <option value="Not started">Not started</option>
        <option value="In progress">In progress</option>
        <option value="Completed">Completed</option>
      </select>
    </div>

    <div class="table-responsive">
      <table class="table align-middle">
        <thead>
          <tr>
            <th>Assignment</th>
            <th>Subject</th>
            <th>Due Date</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="taskList"></tbody>
      </table>
    </div>

    <p id="emptyMessage" class="text-muted text-center py-3" hidden>
      No assignments found.
    </p>
  </div>
</main>

<footer>© 2026 TaskFlow. Stay organised, stay on track.</footer>

<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/tasks.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
